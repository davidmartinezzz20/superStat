<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperStat — Estadísticas de balonmano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"><div class="loading-msg">Cargando…</div></div>

<!-- Cliente de Supabase, con versión fijada a propósito: así una publicación
     nueva de la librería no puede cambiar lo que se ejecuta en el móvil. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>

<!-- Google Identity Services: dibuja el botón de "Entrar con Google" en esta
     misma página. Es la única dependencia sin versión fijada, porque Google
     sirve una sola URL y no publica versiones; a cambio, el login deja de pasar
     por el callback de Supabase y Google anuncia el dominio de la app. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
