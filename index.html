<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: la barra inferior flotante se apoya en el área segura
     del iPhone, así que la página tiene que llegar hasta el borde. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090B">

<!-- Content-Security-Policy: de dónde puede salir cada cosa que carga esta
     página. Es lo que convierte un fallo de escapado en nada: aunque alguien
     colara un <script> en el nombre de un jugador, el navegador no lo
     ejecutaría, y aunque lo ejecutara no podría mandar los datos a ninguna
     parte, porque connect-src solo deja hablar con Supabase.

     Va en el HTML y no solo en las cabeceras del servidor a propósito: dentro
     de la app de Android e iPhone no hay servidor —los archivos se sirven del
     propio aparato— y una cabecera de Vercel allí no llega. vercel.json repite
     la misma política en cabecera para la web, que es donde además sí se puede
     poner frame-ancestors (en <meta> se ignora).

     Las tres excepciones son de Google, y solo del botón de entrar: su script,
     el iframe que dibuja y la hoja de estilos que se trae. Lo demás es 'self'.
     Si algún día hace falta abrir una más, que sea por un motivo escrito. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'none';
  object-src 'none';
  form-action 'none';
  script-src 'self' https://accounts.google.com;
  style-src 'self' 'unsafe-inline' https://accounts.google.com;
  img-src 'self' data: https://accounts.google.com https://*.googleusercontent.com;
  font-src 'self';
  connect-src 'self' https://*.supabase.co https://accounts.google.com;
  frame-src https://accounts.google.com;
  worker-src 'self';
  manifest-src 'self'">

<!-- Que no se filtre a dónde va la gente: al salir a otro sitio no se manda ni
     la dirección de esta página. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>SuperStat — Estadísticas de balonmano</title>
<!-- El icono es el mismo cuadro del logo, en línea como data URI: sin carpeta
     de imágenes ni una petición más, en la línea de "sin build" del proyecto.
     Si se toca el dibujo de brandLogo(), hay que tocarlo aquí también. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23D9182B'/><rect x='6.5' y='17' width='5' height='8' rx='1.4' fill='%23fff'/><rect x='13.5' y='12.5' width='5' height='12.5' rx='1.4' fill='%23fff'/><rect x='20.5' y='7' width='5' height='18' rx='1.4' fill='%23fff'/></svg>">

<!-- Instalable en la pantalla de inicio. Los iconos en PNG salen del mismo
     dibujo con tools/make-icons.js; iOS no lee el manifest para esto y necesita
     su propia etiqueta. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SuperStat">

<!-- Sin fuentes de CDN: la tipografía es la del sistema (San Francisco en los
     aparatos de Apple), que además se ve igual sin conexión. -->
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"><div class="loading-msg">Cargando…</div></div>

<!-- Cliente de Supabase. Va copiado en el repo y no traído de un CDN: dentro de
     la app de móvil la página se sirve desde el propio aparato, y un CDN
     significaría no poder arrancar la primera vez sin cobertura. El nombre
     lleva la versión dentro, que es lo que antes fijaba la URL. Ver vendor/. -->
<script src="vendor/supabase-js-2.116.0.js"></script>

<!-- Google Identity Services: dibuja el botón de "Entrar con Google" en esta
     misma página. Es la única dependencia sin versión fijada, porque Google
     sirve una sola URL y no publica versiones; a cambio, el login deja de pasar
     por el callback de Supabase y Google anuncia el dominio de la app. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Capacitor: la compilación global de @capacitor/core, copiada en vendor/.
     En el navegador no hace nada salvo decir que la plataforma es "web"; dentro
     de la app es lo que deja hablar con los plugins nativos sin bundler. -->
<script src="vendor/capacitor-core-8.5.2.js"></script>

<script src="js/config.js"></script>
<script src="js/native.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<!-- Los textos, en español y en inglés. Va después de store.js porque lee de
     ahí el idioma guardado, y antes de app.js porque app.js ya lo usa al
     pintar la primera pantalla. -->
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>

<!-- El service worker guarda el HTML, el CSS, los scripts y supabase-js, que es
     lo único que antes obligaba a tener cobertura para abrir la app. Quien lo
     registra es este archivo, y está aparte y no en línea por la CSP de arriba:
     con un <script> suelto haría falta 'unsafe-inline', que es justo lo que esa
     política sirve para cerrar. -->
<script src="js/sw-register.js"></script>
</body>
</html>
